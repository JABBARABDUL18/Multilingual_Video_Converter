server.port=8080

# Allow big video uploads
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# Free local Whisper (python + faster-whisper); model: tiny|base|small|medium
python.path=${PYTHON_PATH:python}
whisper.model=${WHISPER_MODEL:base}

# Path to ffmpeg (just "ffmpeg" if it is on PATH)
ffmpeg.path=${FFMPEG_PATH:ffmpeg}

# Folder where uploads and results are stored
app.workspace=workspace
